bbox = [138.87, 35.09, 139.87, 35.71]
n03_prefectures = ["14"]
osm_source = "osm-kanto"
cell_m = 25
walk_m_per_min = 80
levels_min = [5, 10, 15, 20, 25, 30, 45, 60]
access_radius_m = 100
max_offroad_m = 300
smooth_sigma_cells = 1.0
simplify_m = 5
home_view = { center = [139.338, 35.417], zoom = 9 }
