# 神奈川県 (ekiwalk の形式。値は configs/regions/tokyo.toml と同じ規則で決めた)
name = "kanagawa"
label = "神奈川県"
crs = "EPSG:6677"              # 平面直角座標系 IX 系 (JGD2011)
display_prefixes = ["14"]
display_exclude_codes = []
compute_buffer_m = 3000
